<!DOCTYPE html>
<html>
<head>
  <title>Clippy Comics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id='contentdiv'>
      <label class='header1' id='clippycomicslabel'>Clippy Comics</label>
      <br>
      <label class='header2' id='datelabel'></label>
      <br>
      <button id='prevbtn' onclick='doPrev();'>Previous</button>
      <button id='jumpbtn' onclick='doJump();'>Jump</button>
      <button id='latestbtn' onclick='doLatest();'>Latest</button>
      <button id='nextbtn' onclick='doNext();'>Next</button>
      <br>
      <img id='comicdiv'>
      <br>
      <div id='transcriptdiv'></div>
      <br>
      <div id='commentdiv'>
        <form id='commentinput'>
          <label for='commentname'>Name (optional)</label>
          <input id='commentname' name='name' type='text' maxlength='80'>
          <label for='commentmessage'>Comment</label>
          <textarea id='commentmessage' name='message' maxlength='2000' required></textarea>
          <button id='commentsubmit' type='submit'>Send</button>
          <p id='commentstatus' role='status' aria-live='polite'></p>
        </form>
        <div id='commenthistorydiv'></div>
        <br>
      </div>
  </div>
  <p><br></p>
  <script src='common.js'></script>
  <script src='comments-api.js'></script>
  <script src='comments-ui.js'></script>
  <script src='index.js'></script>
</body>
</html>
